<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="description" content="新潟県と県内の市町村の議会で、外国人の受け入れについて誰が何を言ったかを、会議録の原文つきでまとめた資料の目次です。">
<title>新潟県の移民政策反対情報</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
/* 一段組み：上に地域の選択、その下に統計カード、トピックの絞り込み、資料の一覧 */
:root{
  --bg:#f5f7f6; --surface:#ffffff; --fg:#1d2a2c; --muted:#5b6a6c; --line:#d7dfdd;
  --accent:#1f6b6a; --accent-soft:#e1efed; --seen:#8a6d1f; --seen-soft:#f6eed6;
  --serif:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  --sans:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121a1b; --surface:#1a2526; --fg:#e4ecea; --muted:#9aaaa8; --line:#2c3a3b;
  --accent:#6fc3bf; --accent-soft:#1f3433; --seen:#e0c070; --seen-soft:#3a3220; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121a1b; --surface:#1a2526; --fg:#e4ecea; --muted:#9aaaa8; --line:#2c3a3b;
  --accent:#6fc3bf; --accent-soft:#1f3433; --seen:#e0c070; --seen-soft:#3a3220; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.7}
.wrap{max-width:860px;margin:0 auto;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:22px}
h1{font-family:var(--serif);font-size:1.7rem;line-height:1.35;margin:0;text-wrap:balance}
h2{font-family:var(--serif);font-size:1.15rem;margin:0}
.lead{color:var(--muted);margin:4px 0 0}
.draft{font-size:.8rem;letter-spacing:.06em;color:var(--seen);background:var(--seen-soft);display:inline-block;padding:2px 10px;border-radius:4px}
.picker{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg);min-width:0;max-width:100%}
label{font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:.88rem;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:4px 12px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.chip:focus-visible,select:focus-visible,.seen:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.src{font-size:.75rem;color:var(--muted)}
.bar{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;align-items:baseline}
.count{font-size:.88rem;color:var(--muted)}
ul.items{list-style:none;margin:0;padding:0;display:grid;gap:0;border-top:1px solid var(--line)}
.item{display:grid;grid-template-columns:1fr auto;gap:6px 14px;padding:12px 2px;border-bottom:1px solid var(--line)}
.item>div{min-width:0}
.item .t{font-weight:700}
.item a{color:var(--accent)}
.meta{font-size:.8rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px}
.tag{background:var(--accent-soft);color:var(--accent);padding:0 8px;border-radius:4px}
.wait{color:var(--muted);font-size:.85rem}
.seen{font:inherit;font-size:.82rem;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:6px;padding:4px 10px;cursor:pointer;white-space:nowrap;align-self:start}
.seen[aria-pressed="true"]{background:var(--seen-soft);border-color:var(--seen);color:var(--seen)}
.item.isseen .t{color:var(--muted)}
.empty{color:var(--muted);padding:16px 0}
.news{display:grid;gap:8px}
ul.nlist{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.nlist li{padding:9px 2px;border-bottom:1px solid var(--line);display:grid;gap:2px;min-width:0}
.nlist a{color:var(--accent);font-weight:700;overflow-wrap:anywhere}
.more{font-size:.88rem;color:var(--accent)}
footer{font-size:.78rem;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
</style>
<style>body{margin:0}</style>
<script data-goatcounter="https://niigata-imin-info.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>
<div class="wrap" lang="ja">
  <header>
    <span class="draft">準備中のページです</span>
    <h1>新潟県の移民政策反対情報</h1>
    <p class="lead">新潟県と県内の市町村の議会・委員会・審議会で、外国人の受け入れについて誰が何を言ったかを、会議録の原文つきでまとめた資料の目次です。地域を選ぶと、その地域の資料が出ます。</p>
  </header>
  <div class="picker">
    <label for="area">地域</label>
    <select id="area"></select>
  </div>
  <section class="news" aria-label="新着">
    <div class="bar"><h2 id="newsTitle">新着</h2><a class="more" id="newsMore" href="news.html">新着をすべて見る</a></div>
    <ul class="nlist" id="news"><li class="empty">読み込み中…</li></ul>
  </section>
  <div class="chips" id="topics" role="group" aria-label="トピック"></div>
  <section>
    <div class="bar"><h2 id="listTitle">資料</h2><span class="count" id="count"></span></div>
    <ul class="items" id="items"></ul>
  </section>
  <footer>「見た」の印は、この端末のブラウザだけに残ります。</footer>
</div>
<script>
const POP = [{"name": "新潟県", "code": "15"}, {"name": "新潟市", "code": "151009"}, {"name": "長岡市", "code": "152021"}, {"name": "三条市", "code": "152048"}, {"name": "柏崎市", "code": "152056"}, {"name": "新発田市", "code": "152064"}, {"name": "小千谷市", "code": "152081"}, {"name": "加茂市", "code": "152099"}, {"name": "十日町市", "code": "152102"}, {"name": "見附市", "code": "152111"}, {"name": "村上市", "code": "152129"}, {"name": "燕市", "code": "152137"}, {"name": "糸魚川市", "code": "152161"}, {"name": "妙高市", "code": "152170"}, {"name": "五泉市", "code": "152188"}, {"name": "上越市", "code": "152226"}, {"name": "阿賀野市", "code": "152234"}, {"name": "佐渡市", "code": "152242"}, {"name": "魚沼市", "code": "152251"}, {"name": "南魚沼市", "code": "152269"}, {"name": "胎内市", "code": "152277"}, {"name": "聖籠町", "code": "153079"}, {"name": "弥彦村", "code": "153427"}, {"name": "田上町", "code": "153613"}, {"name": "阿賀町", "code": "153851"}, {"name": "出雲崎町", "code": "154059"}, {"name": "湯沢町", "code": "154610"}, {"name": "津南町", "code": "154822"}, {"name": "刈羽村", "code": "155047"}, {"name": "関川村", "code": "155811"}, {"name": "粟島浦村", "code": "155861"}];
const TOPICS = ["土地","宗教・モスク・墓地","給食・食","介護・働く人","学校・子ども","選挙・議員","予算・補助金","人口・統計"];
// status: "open"=公開済みリンクあり / "share"=要共有 / "wait"=公開版を準備中
const ITEMS = [
 {id:"pref-kaigo",area:"15",t:"県の介護人材の予算（修学資金・介護テクノロジーの補助）",topics:["介護・働く人","予算・補助金"],date:"2026-10-24",status:"wait"},
 {id:"pref-india",area:"15",t:"日印友好交流促進知事ネットワークとインドでの介護人材の面接会",topics:["介護・働く人"],date:"2026-10-29",status:"wait"},
 {id:"pref-china",area:"15",t:"県内の中国・韓国籍の在留資格",topics:["人口・統計"],date:"",status:"wait"},
 {id:"pref-land",area:"15",t:"県内の外国人・外国資本の土地取得の一覧",topics:["土地"],date:"",status:"wait"},
 {id:"tsubame-sen",area:"152137",t:"燕市議選 候補者の外国人政策の発言",topics:["選挙・議員"],date:"2026-10",status:"open",url:"https://claude.ai/artifact/MVMu7SeonWaxMesRKzbQfj"},
 {id:"tsubame-zou",area:"152137",t:"燕市の社会増83人と外国人の転入",topics:["人口・統計"],date:"2026-10-27",status:"wait"},
 {id:"mitsuke-sen",area:"152111",t:"見附市議選 候補者と会議録の発言",topics:["選挙・議員"],date:"2026-10",status:"share",url:"https://claude.ai/artifact/YaAFf4bGTQAJU7rSJgbko6"},
 {id:"mitsuke-bochi",area:"152111",t:"エラヒ議員と市の墓地をめぐるやりとり",topics:["宗教・モスク・墓地","選挙・議員"],date:"",status:"wait"},
 {id:"mu-land",area:"152269",t:"南魚沼市 外国人・外資の土地取得 市の答弁の移り変わり",topics:["土地"],date:"",status:"wait"},
 {id:"mu-water",area:"152269",t:"南魚沼市 水源と土地",topics:["土地"],date:"",status:"wait"},
 {id:"mu-sosei",area:"152269",t:"創生推進会議 委員3人の外資・土地についての発言",topics:["土地"],date:"2026-10-27",status:"wait"},
 {id:"mu-halal",area:"152269",t:"ハラル給食の大変さ（話された条件）",topics:["給食・食","宗教・モスク・墓地"],date:"2026-10-28",status:"wait"},
 {id:"mu-center",area:"152269",t:"給食センターのハラル対応の経緯",topics:["給食・食"],date:"",status:"wait"},
 {id:"mu-yamato",area:"152269",t:"大和地区（浦佐小）の留学生の子どもと学校・保育",topics:["学校・子ども"],date:"2026-10-29",status:"wait"},
 {id:"mu-women",area:"152269",t:"20〜39歳女性の減少と外国籍女性（総務部長の答弁）",topics:["人口・統計"],date:"2026-10-24",status:"wait"},
 {id:"joetsu-remake",area:"152226",t:"上越市 住民の不安・土地・JICA基金（3月投稿のリメイク）",topics:["土地","予算・補助金"],date:"2026-10-23",status:"wait"},
 {id:"joetsu-dc",area:"152226",t:"上越・妙高のデータセンター計画 会議録の発言",topics:["土地"],date:"2026-10-27",status:"wait"},
 {id:"seiro-mosque",area:"153079",t:"新潟東港のパキスタン人とモスクの成り立ち・墓地問題の年表",topics:["宗教・モスク・墓地"],date:"",status:"wait"},
 {id:"seiro-kokuseki",area:"153079",t:"聖籠町と新潟市北区の国籍別・在留資格別の人数",topics:["人口・統計"],date:"2025-12",status:"wait"},
 {id:"yuzawa-norita",area:"154610",t:"湯沢町 旧ノリタ跡地",topics:["土地"],date:"2026-10-28",status:"wait"},
 {id:"yuzawa-giin",area:"154610",t:"湯沢町議会 議員ごとの外国人関係の発言（現職12人・元議員18人、多文化共生推進／慎重）",topics:["選挙・議員"],date:"2026-10-31",status:"wait"},
 {id:"yuzawa-chocho",area:"154610",t:"湯沢町長の答弁（外国人関係）",topics:["選挙・議員"],date:"2026-10-31",status:"wait"},
 {id:"itoigawa-nochi",area:"152161",t:"糸魚川市農業委員会 外国籍の農地取得の申請",topics:["土地"],date:"",status:"wait"},
 {id:"sanjo-kaigo",area:"152048",t:"三条市 介護人材確保対策検討会と外国人材の補助金",topics:["介護・働く人","予算・補助金"],date:"",status:"wait"},
 {id:"niigata-kokusai",area:"151009",t:"新潟市国際課長「積極的に受け入れるのではなくて」",topics:["選挙・議員"],date:"",status:"wait"}
];
let area="15", topic=null, seen={};
try{seen=JSON.parse(localStorage.getItem("seen")||"{}")}catch(e){seen={}}
function save(){try{localStorage.setItem("seen",JSON.stringify(seen))}catch(e){}}
const sel=document.getElementById("area");
POP.forEach(p=>{const o=document.createElement("option");o.value=p.code;
  const n=ITEMS.filter(i=>i.area===p.code).length;
  o.textContent=p.name+(p.code==="15"?"（全体）":"")+(n?"　"+n+"件":"");sel.appendChild(o)});
const tp=document.getElementById("topics");
["すべて",...TOPICS].forEach(t=>{const b=document.createElement("button");b.className="chip";b.textContent=t;
  b.onclick=()=>{topic=t==="すべて"?null:t;render()};tp.appendChild(b)});
function gcCount(path,title){try{if(window.goatcounter&&window.goatcounter.count)window.goatcounter.count({path:path,title:title,event:true})}catch(e){}}
sel.onchange=()=>{area=sel.value;location.hash="a"+area;render();const p=POP.find(x=>x.code===area);gcCount("area-"+area,p?p.name:area)};
function fromHash(){const q=new URLSearchParams(location.search).get("area");if(q&&POP.some(p=>p.code===q))area=q;const m=location.hash.match(/^#a(\d+)$/);if(m&&POP.some(p=>p.code===m[1]))area=m[1]}
function render(){
  sel.value=area;
  [...tp.children].forEach(b=>b.setAttribute("aria-pressed",String((topic||"すべて")===b.textContent)));
  const p=POP.find(x=>x.code===area);
  const list=ITEMS.filter(i=>(area==="15"||i.area===area)&&(!topic||i.topics.includes(topic)));
  document.getElementById("listTitle").textContent=(area==="15"?"県内すべての資料":p.name+"の資料")+(topic?"｜"+topic:"");
  const n=list.filter(i=>seen[i.id]).length;
  document.getElementById("count").textContent=list.length?`${list.length}件中 ${n}件 見た`:"";
  const ul=document.getElementById("items");ul.innerHTML="";
  if(!list.length){ul.innerHTML='<li class="empty">この地域・トピックの資料はまだありません。</li>';return}
  list.forEach(i=>{
    const a=POP.find(x=>x.code===i.area).name;
    const li=document.createElement("li");li.className="item"+(seen[i.id]?" isseen":"");
    const title=i.status==="wait"?`<span class="t">${i.t}</span> <span class="wait">（公開版を準備中）</span>`:`<a class="t" href="${i.url}" target="_blank" rel="noopener" data-goatcounter-click="item-${i.id}" data-goatcounter-title="${i.t}">${i.t}</a>`+(i.status==="share"?' <span class="wait">（共有の設定待ち）</span>':"");
    li.innerHTML=`<div>${title}<div class="meta"><span>${a}</span>${i.topics.map(t=>`<span class="tag">${t}</span>`).join("")}${i.date?`<span>${i.date}</span>`:""}</div></div>`;
    const b=document.createElement("button");b.className="seen";b.setAttribute("aria-pressed",String(!!seen[i.id]));
    b.textContent=seen[i.id]?"✓ 見た":"見た";
    b.onclick=()=>{if(seen[i.id])delete seen[i.id];else seen[i.id]=Date.now();save();render()};
    li.appendChild(b);ul.appendChild(li);
  });
}

let NEWS=null;
function newsItems(d){return Array.isArray(d)?d:(d&&Array.isArray(d.items)?d.items:[])}
function safeUrl(u){try{const x=new URL(u);return /^https?:$/.test(x.protocol)?x.href:null}catch(e){return null}}
function renderNews(){
  const ul=document.getElementById("news");ul.textContent="";
  const p=POP.find(x=>x.code===area);
  document.getElementById("newsTitle").textContent=area==="15"?"新着（県内すべて）":p.name+"の新着";
  document.getElementById("newsMore").href="news.html"+(area==="15"?"":"?area="+area);
  if(NEWS===null){const li=document.createElement("li");li.className="empty";li.textContent="新着は準備中です。";ul.appendChild(li);return}
  const list=NEWS.filter(n=>area==="15"||String(n.area||"")===area).sort((a,b)=>String(b.date||b.found||"").localeCompare(String(a.date||a.found||""))).slice(0,10);
  if(!list.length){const li=document.createElement("li");li.className="empty";li.textContent="この地域の新着はまだありません。";ul.appendChild(li);return}
  list.forEach(n=>{const li=document.createElement("li");const u=safeUrl(n.link);
    const a=document.createElement(u?"a":"span");a.textContent=n.title||"";if(u){a.href=u;a.target="_blank";a.rel="noopener";a.dataset.goatcounterClick="news-"+(n.area||"x")}
    const m=document.createElement("div");m.className="meta";[n.date||n.found,n.source,n.group].filter(Boolean).forEach(s=>{const sp=document.createElement("span");sp.textContent=s;m.appendChild(sp)});
    li.append(a,m);ul.appendChild(li)});
}
fetch("data/news.json",{cache:"no-cache"}).then(r=>r.ok?r.json():null).then(d=>{NEWS=d?newsItems(d):null;renderNews()}).catch(()=>{NEWS=null;renderNews()});
const _render=render;render=function(){_render();renderNews()};
fromHash();window.addEventListener("hashchange",()=>{fromHash();render()});render();
</script>

</body>
</html>
